name: Refresh league data

on:
  schedule:
    # Tue 6:00 PM and Wed 9:00 AM America/New_York.
    # Cron is UTC; these are set for EST (Nov-Mar). During EDT they fire an hour late (7 PM / 10 AM).
    - cron: "0 23 * * 2"
    - cron: "0 14 * * 3"
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch league data
        working-directory: src
        run: python fetch_league.py league.json
      - name: Build site
        working-directory: src
        run: python build.py
      - name: Commit and push if changed
        run: |
          git config user.name "lpp2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh league data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
